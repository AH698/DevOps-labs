# Moved to task-2 because done with this YAML file however 
# when you want to run this it must be in the .github/workflows
# otherwise pipeline will not work

name: pushing to Dockerhub through pipeline
on: [push]

jobs: 
    build: 
        runs-on: ubuntu-latest 
        steps: 
            - name: checkout code 
              uses: actions/checkout@v4

            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Docker hub login 
              uses: docker/login-action@v4
              with: 
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Get short SHA
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: docker build and push
              uses: docker/build-push-action@v4
              with:
                context: ./cicd/task-2
                push: true
                tags: |
                    ah698/task-2:latest
                    ah698/task-2:${{ steps.vars.outputs.sha_short }}
            